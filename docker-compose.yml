# Fase 0: só o Postgres (dev). Os serviços api, web e caddy entram na Fase 1 (ver docs/operacao/deploy.md).
name: meta-bi

services:
  postgres:
    image: postgres:16-alpine
    container_name: meta-bi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-metabi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-metabi_dev}
      POSTGRES_DB: ${POSTGRES_DB:-metabi}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
