name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: metabi
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metabi_test
        ports: ['5517:5432']
        options: >-
          --health-cmd "pg_isready -U metabi" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Gerar .env de CI
        run: |
          pnpm setup:env
          sed -i 's#^DATABASE_URL_TEST=.*#DATABASE_URL_TEST=postgresql://metabi:postgres@127.0.0.1:5517/metabi_test?schema=public#' .env
          sed -i 's#^DATABASE_URL=.*#DATABASE_URL=postgresql://metabi:postgres@127.0.0.1:5517/metabi_test?schema=public#' .env
      - run: pnpm secrets:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm hooks:test
      - run: pnpm build
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env: { CI: 'true' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
