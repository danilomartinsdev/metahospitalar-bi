# Produção: docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Só o Caddy publica portas. Postgres e API ficam na rede interna.
name: meta-bi-prod

x-seguranca: &seguranca
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *seguranca
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-metabi}
      POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256 --auth-local=scram-sha-256'
      TZ: America/Sao_Paulo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: docker/api.Dockerfile, target: migrate }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-metabi}?schema=public
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    <<: *seguranca
    build: { context: ., dockerfile: docker/api.Dockerfile, target: runtime }
    env_file: .env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4318
      COOKIE_SECURE: 'true'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-metabi}?schema=public
    volumes:
      - storage:/app/storage
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }

  web:
    <<: *seguranca
    build: { context: ., dockerfile: docker/web.Dockerfile }
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
